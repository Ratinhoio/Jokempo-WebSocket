<!DOCTYPE html>

<html>

<head>

    <title>Jokenpo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f6f8;

            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .titulo {
            margin-top: 0;
            margin-bottom: 5px;

            font-size: 32px;
            color: #222;
        }

        .subtitulo {
            margin-top: 0;
            margin-bottom: 30px;

            color: #888;
            font-size: 14px;
        }

        #nomeJogador {
            font-size: 18px;
            font-weight: normal;

            color: #555;

            background: #f5f5f5;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 25px;
        }

        .label {
            display: block;

            margin-bottom: 10px;

            font-weight: bold;
            font-size: 15px;

            text-align: left;
        }

        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;

            background: white;

            font-size: 15px;

            outline: none;

            cursor: pointer;
        }

        select:focus {
            border-color: #555;
        }

        button {
            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: #111;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            min-height: 20px;

            margin-top: 25px;

            padding: 12px;

            border-radius: 8px;

            background: #f7f7f7;

            color: #666;

            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1 class="titulo">Jokenpo</h1>

        <p class="subtitulo">
            Pedra, papel ou tesoura?
        </p>

        <div id="jogo"></div>

        <h1 id="nomeJogador"></h1>

        <label class="label" for="jogada">
            Selecione sua jogada
        </label>

        <select id="jogada" name="jogada">

            <option value="" disabled selected hidden>
                Escolha a sua jogada
            </option>

            <option value="pedra">Pedra</option>

            <option value="papel">Papel</option>

            <option value="tesoura">Tesoura</option>

        </select>

        <button id="botaoEnviar" onclick="enviar()" disabled>
            Enviar Jogada
        </button>

        <p id="status"></p>

    </div>


    <script>

        const socket = new WebSocket("ws://localhost:6969");

        let numeroJogador = 0;

        socket.onopen = function () {

            console.log("Conectado ao servidor");

        };


        socket.onmessage = function (evento) {

            const dados = JSON.parse(evento.data);


            if (dados.tipo === "sala_cheia") {

                document.getElementById("status").innerText =
                    "Sala cheia! Aguarde a proxima partida.";

                document.getElementById("jogada").disabled = true;

                document.getElementById("botaoEnviar").disabled = true;

                socket.close();

                alert("Sala cheia! Aguarde a proxima partida.");

            }


            if (dados.tipo === "resultado") {

                document.getElementById("status").innerText =
                    dados.mensagem;

                document.getElementById("jogada").value = "";

                document.getElementById("jogada").disabled = false;

                document.getElementById("botaoEnviar").disabled = false;

            }


            if (dados.tipo === "vitoria" && dados.jogador === numeroJogador) {

                document.getElementById("status").innerText =
                    dados.mensagem;

                document.getElementById("jogada").disabled = false;

                document.getElementById("botaoEnviar").disabled = false;

                document.getElementById("jogada").value = "";

            }


            else if (dados.tipo === "derrota" && dados.jogador === numeroJogador) {

                document.getElementById("status").innerText =
                    dados.mensagem;

                document.getElementById("jogada").disabled = false;

                document.getElementById("botaoEnviar").disabled = false;

                document.getElementById("jogada").value = "";

            }


            if (dados.tipo === "conexao") {

                document.getElementById("nomeJogador").innerText =
                    "Voce eh o " + dados.jogador;

                numeroJogador = dados.jogador;

                document.getElementById("jogada").disabled = false;

                document.getElementById("botaoEnviar").disabled = false;

            }


            if (dados.tipo === "jogada") {

                console.log(
                    "O",
                    dados.jogador,
                    "jogou",
                    dados.valor
                );

            }

        };


        function enviar() {

            const valorJogada =
                document.getElementById("jogada").value;


            if (valorJogada === "") {

                alert("Escolha uma jogada!");

                return;

            }


            const mensagem = {

                tipo: "jogada",

                jogador: numeroJogador,

                valor: valorJogada

            };


            socket.send(JSON.stringify(mensagem));


            document.getElementById("status").innerText =
                "Aguardando o outro jogador...";


            document.getElementById("jogada").disabled = true;

            document.getElementById("botaoEnviar").disabled = true;

        }

    </script>

</body>

</html>
